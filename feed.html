<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Systems Feed — AgentMart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="container d-flex justify-content-between align-items-center flex-wrap py-2">
    <span class="brand py-2">agent<span>mart</span></span>
    <div class="d-flex" style="overflow-x:auto;">
      <a class="nav-tab" data-tab="feed" href="feed.html">Systems Feed</a>
      <a class="nav-tab" data-tab="needs" href="needs.html">Business Needs</a>
      <a class="nav-tab" data-tab="portal" href="portal.html">Creator Portal</a>
      <a class="nav-tab" data-tab="inbox" href="inbox.html">Inbox</a>
      <a class="nav-tab" data-tab="profile" href="profile.html">Profile</a>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn-ghost small" onclick="toggleTheme()" title="Toggle theme" id="theme-btn">🌙</button>
      <span id="topbar-role" class="role-chip">DEVELOPER</span>
      <button class="btn-ghost small" onclick="handleLogout()" title="Log out">⏻</button>
    </div>
  </div>
</div>

<div class="container py-4">
  <div class="section-head">
    <div>
      <h2>Explore AI Systems</h2>
      <p>Production-ready automations published by developers on the network.</p>
    </div>
  </div>

  <div class="panel p-3 mb-3">
    <input type="text" class="form-control mb-3" id="feed-search" placeholder="Search systems by title or stack..." oninput="renderFeed()">
    <div id="feed-filters"></div>
  </div>

  <div id="feed-list" class="row g-3"></div>
</div>

<footer class="site-footer">
  <div class="container d-flex justify-content-between flex-wrap">
    <span>© 2026 AgentMart</span>
    <span>Support: harshalmohite28@gmail.com</span>
  </div>
</footer>

<div class="toast-banner" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
<script>
  $(function(){
    const u = guardApp('feed');
    if (u) renderFeed();
  });
</script>
</body>
</html>
