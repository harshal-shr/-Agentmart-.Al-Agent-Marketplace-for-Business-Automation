<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Needs — AgentMart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="container d-flex justify-content-between align-items-center flex-wrap py-2">
    <span class="brand py-2">agent<span>mart</span></span>
    <div class="d-flex" style="overflow-x:auto;">
      <a class="nav-tab" data-tab="feed" href="feed.html">Systems Feed</a>
      <a class="nav-tab" data-tab="needs" href="needs.html">Business Needs</a>
      <a class="nav-tab" data-tab="portal" href="portal.html">Creator Portal</a>
      <a class="nav-tab" data-tab="inbox" href="inbox.html">Inbox</a>
      <a class="nav-tab" data-tab="profile" href="profile.html">Profile</a>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn-ghost small" onclick="toggleTheme()" title="Toggle theme" id="theme-btn">🌙</button>
      <span id="topbar-role" class="role-chip">DEVELOPER</span>
      <button class="btn-ghost small" onclick="handleLogout()" title="Log out">⏻</button>
    </div>
  </div>
</div>

<div class="container py-4">
  <div class="section-head">
    <div>
      <h2>Active Business Pipelines</h2>
      <p>Operational bottlenecks posted directly by companies.</p>
    </div>
    <button class="btn btn-amber" id="post-req-btn" onclick="showPostRequirement()">+ Post Requirement</button>
  </div>

  <div class="panel p-3 mb-3">
    <input type="text" class="form-control" id="needs-search" placeholder="Search requirements by title..." oninput="renderNeeds()">
  </div>

  <div id="post-req-form" class="panel p-4 mb-4" style="display:none;">
    <h3 class="h6 mb-3">New requirement</h3>
    <div class="mb-3">
      <label>Title</label>
      <input type="text" class="form-control" id="req-title" placeholder="e.g., Automate WhatsApp customer replies">
    </div>
    <div class="mb-3">
      <label>Description</label>
      <textarea class="form-control" id="req-desc" rows="3" placeholder="Describe the problem you need automated..."></textarea>
    </div>
    <div class="mb-3" style="max-width:200px;">
      <label>Duration</label>
      <select class="form-select" id="req-duration">
        <option>1 week</option><option>2 weeks</option><option>3 weeks</option><option>1 month</option>
      </select>
    </div>
    <button class="btn btn-amber" onclick="submitRequirement()" id="req-submit-btn">Publish Requirement</button>
    <button class="btn btn-outline-line ms-2" onclick="cancelReqForm()">Cancel</button>
  </div>

  <div id="needs-list" class="d-flex flex-column gap-3"></div>
</div>

<footer class="site-footer">
  <div class="container d-flex justify-content-between flex-wrap">
    <span>© 2026 AgentMart</span>
    <span>Support: harshalmohite28@gmail.com</span>
  </div>
</footer>

<div class="toast-banner" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
<script>
  $(function(){
    const u = guardApp('needs');
    if (u) renderNeeds();
  });
</script>
</body>
</html>
