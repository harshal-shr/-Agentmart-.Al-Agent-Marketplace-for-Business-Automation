<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In / Register — AgentMart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="max-width:460px; padding-top:2.5rem;">
  <div class="text-center mb-4">
    <a href="index.html" style="text-decoration:none;">
      <span class="brand">agent<span>mart</span></span>
    </a>
    <div class="node-line mt-2">// build.deploy.acquire</div>
  </div>

  <div class="panel p-4">
    <!-- Login -->
    <div id="auth-login">
      <h2 class="h4 mb-1">Welcome back</h2>
      <p class="text-muted small mb-4">Sign in to your workspace.</p>
      <div class="mb-3">
        <label>Email address</label>
        <input type="email" class="form-control" id="login-email" placeholder="you@company.com">
      </div>
      <div class="mb-4">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" class="form-control" id="login-password" placeholder="••••••••">
          <span class="password-eye" onclick="togglePasswordVisibility('login-password', this)">👁</span>
        </div>
      </div>
      <button class="btn btn-amber w-100" onclick="handleLogin()">Sign In</button>
      <p class="text-center mt-3 small">
        <a href="#" style="color:var(--amber)" onclick="switchAuth('register');return false;">No account? Register here</a>
      </p>
    </div>

    <!-- Register -->
    <div id="auth-register" style="display:none;">
      <h2 class="h4 mb-1">Create your account</h2>
      <p class="text-muted small mb-3">Tell us how you'll use AgentMart.</p>

      <label class="d-block mb-2">I am registering as</label>
      <div class="role-toggle mb-3">
        <input type="radio" name="reg-role" id="role-dev" value="developer" checked onchange="toggleRegRole()">
        <label for="role-dev">AI Developer</label>
        <input type="radio" name="reg-role" id="role-client" value="client" onchange="toggleRegRole()">
        <label for="role-client">Business Client</label>
      </div>

      <div class="mb-3">
        <label>Full name</label>
        <input type="text" class="form-control" id="reg-name" placeholder="Your name">
      </div>

      <div class="mb-3" id="reg-company-wrap" style="display:none;">
        <label>Company name</label>
        <input type="text" class="form-control" id="reg-company" placeholder="e.g., Acme Automations Ltd.">
      </div>

      <div class="mb-3" id="reg-github-wrap">
        <label>GitHub profile <span class="text-muted">(optional)</span></label>
        <input type="text" class="form-control" id="reg-github" placeholder="https://github.com/username">
        <div class="hint-box mt-2">Linking GitHub helps clients trust your deployment history.</div>
      </div>

      <div class="mb-3">
        <label>LinkedIn profile <span class="text-muted">(optional)</span></label>
        <input type="text" class="form-control" id="reg-linkedin" placeholder="https://linkedin.com/in/username">
      </div>

      <div class="mb-3">
        <label>Email address</label>
        <input type="email" class="form-control" id="reg-email" placeholder="you@company.com">
      </div>

      <div class="mb-4">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" class="form-control" id="reg-password" placeholder="••••••••">
          <span class="password-eye" onclick="togglePasswordVisibility('reg-password', this)">👁</span>
        </div>
      </div>

      <button class="btn btn-amber w-100" onclick="handleRegister()">Create Account</button>
      <p class="text-center mt-3 small">
        <a href="#" style="color:var(--amber)" onclick="switchAuth('login');return false;">Already have an account? Sign in</a>
      </p>
    </div>

    <hr style="border-color:var(--border)">
    <div class="d-flex justify-content-between align-items-center small">
      <span class="text-muted">Need help?</span>
      <button class="btn btn-outline-line btn-sm" onclick="copySupport(this)">Copy support email</button>
    </div>
  </div>
</div>

<div class="toast-banner" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
<script>
  // If already logged in, skip straight to the app. Otherwise honor ?mode=register|login
  if (currentUser()) {
    window.location.href = 'feed.html';
  } else {
    const mode = new URLSearchParams(window.location.search).get('mode') || 'login';
    switchAuth(mode === 'register' ? 'register' : 'login');
  }
</script>
</body>
</html>
