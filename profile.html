<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — AgentMart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="container d-flex justify-content-between align-items-center flex-wrap py-2">
    <span class="brand py-2">agent<span>mart</span></span>
    <div class="d-flex" style="overflow-x:auto;">
      <a class="nav-tab" data-tab="feed" href="feed.html">Systems Feed</a>
      <a class="nav-tab" data-tab="needs" href="needs.html">Business Needs</a>
      <a class="nav-tab" data-tab="portal" href="portal.html">Creator Portal</a>
      <a class="nav-tab" data-tab="inbox" href="inbox.html">Inbox</a>
      <a class="nav-tab" data-tab="profile" href="profile.html">Profile</a>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn-ghost small" onclick="toggleTheme()" title="Toggle theme" id="theme-btn">🌙</button>
      <span id="topbar-role" class="role-chip">DEVELOPER</span>
      <button class="btn-ghost small" onclick="handleLogout()" title="Log out">⏻</button>
    </div>
  </div>
</div>

<div class="container py-4">
  <div class="mx-auto" style="max-width:640px;">
    <div class="panel p-4">
      <div class="d-flex align-items-center gap-3 mb-4">
        <div id="profile-avatar" style="width:56px;height:56px;border-radius:50%;background:var(--amber);color:#1A1200;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;flex-shrink:0;">HA</div>
        <div>
          <div id="profile-name-display" class="h5 mb-0">—</div>
          <span id="profile-role-display" class="role-chip">DEVELOPER</span>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label d-block">Full name</label>
          <input type="text" class="form-control" id="profile-name">
        </div>
        <div class="col-md-6">
          <label class="form-label d-block">Username handle</label>
          <input type="text" class="form-control" id="profile-handle" placeholder="e.g., dev_22">
        </div>
      </div>
      <div class="mt-3">
        <label class="form-label d-block">Avatar image URL <span class="text-muted">(optional)</span></label>
        <input type="text" class="form-control" id="profile-avatar-url" placeholder="https://example.com/your-photo.jpg" oninput="renderProfile()">
      </div>
      <div class="mt-3" id="profile-company-wrap" style="display:none;">
        <label class="form-label d-block">Company name</label>
        <input type="text" class="form-control" id="profile-company">
      </div>
      <div class="mt-3">
        <label class="form-label d-block">Bio / pipeline focus</label>
        <textarea class="form-control" id="profile-bio" rows="3" placeholder="Tell others what workflows you engineer..."></textarea>
      </div>
      <div class="row g-3 mt-1">
        <div class="col-md-6">
          <label class="form-label d-block">GitHub profile link</label>
          <input type="text" class="form-control" id="profile-github">
        </div>
        <div class="col-md-6">
          <label class="form-label d-block">LinkedIn profile link</label>
          <input type="text" class="form-control" id="profile-linkedin">
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <button class="btn btn-outline-line" onclick="handleLogout()">Log out</button>
        <button class="btn btn-amber" onclick="saveProfile()">Save Profile</button>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container d-flex justify-content-between flex-wrap">
    <span>© 2026 AgentMart</span>
    <span>Support: harshalmohite28@gmail.com</span>
  </div>
</footer>

<div class="toast-banner" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
<script>
  $(function(){
    const u = guardApp('profile');
    if (u) renderProfile();
  });
</script>
</body>
</html>
